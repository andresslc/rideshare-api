version: "3.9"

# Secrets live in .env.staging on the EC2 host (gitignored). Redis wiring stays
# inline because it names services on the compose network.
services:
  app-staging:
    build: .
    container_name: node_app_staging
    ports:
      - "3002:3000"
    restart: always
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - REDIS_HOST=redis-staging
      - REDIS_PORT=6379
      - REDIS_IS_ENABLED=true
      - REDIS_DB=0
      - BULLMQ_ENABLED=true
    depends_on:
      - redis-staging
    networks:
      - staging-network

  redis-staging:
    image: redis:7-alpine
    container_name: redis_staging
    ports:
      - "6382:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - staging-network

volumes:
  redis_staging_data:
networks:
  staging-network:
    driver: bridge
